# STATUS DEFINITIONS:
# ==================
# Epic Status:
#   - backlog: Epic not yet started
#   - in-progress: Epic actively being worked on
#   - done: All stories in epic completed
#
# Epic Status Transitions:
#   - backlog → in-progress: Automatically when first story is created (via create-story)
#   - in-progress → done: Manually when all stories reach 'done' status
#
# Story Status:
#   - backlog: Story only exists in epic file
#   - ready-for-dev: Story file created in stories folder
#   - in-progress: Developer actively working on implementation
#   - review: Ready for code review (via Dev's code-review workflow)
#   - done: Story completed
#
# Retrospective Status:
#   - optional: Can be completed but not required
#   - done: Retrospective has been completed
#
# WORKFLOW NOTES:
# ===============
# - Epic transitions to 'in-progress' automatically when first story is created
# - Stories can be worked in parallel if team capacity allows
# - Developer typically creates next story after previous one is 'done' to incorporate learnings
# - Dev moves story to 'review', then runs code-review (fresh context, different LLM recommended)

# REVIEW STATE (2026-07-17 — epic 1 closed):
# =========================
# All three stories passed hands-on human review by Ben on the demo data
# ("besteht meinen test, sieht ordentlich aus"), then went through the code-review
# workflow: 9 agents (3 layers x 3 stories), 65 raw findings -> 41 after dedupe ->
# 4 decisions, 29 patches, 8 dismissed. All 33 (29 + the 4 resolved decisions) were
# APPLIED, verified, and closed by Ben on 2026-07-17.
#
# Three of the findings were real user-facing bugs, all reproduced and then proven
# fixed in a real browser:
#  - 1.1: a German first key ("Pruefer: Ben") reverted the whole header to
#    <hr>+<h2> garbage AND dragged the download filename with it (internal-draft.html).
#    The sniffer's key alphabet was stricter than its own parser's.
#  - 1.2: the @supports anchor-positioning block sat in the app stylesheet twice and
#    in READONLY_CSS zero times, so every read-only export -- the artifacts that
#    actually travel -- lacked the feature they were built for, and the measurements
#    taken from them were void.
#  - 1.3: marked-footnote does not mint unique reference ids; a document with both
#    [^bgb] (cited twice) and [^bgb-2] sent [^bgb-2]'s marker to the WRONG footnote
#    while its hover preview still showed the right text. Pairing now goes through
#    the marker's href, which is unambiguous.
#
# TWO ITEMS REMAIN OPEN AND ARE TRACKED IN deferred-work.md, NOT LOST IN THIS CLOSE:
#  - Safari/WebKit has never been opened, and story 1.2's AC2 names it explicitly.
#    Chromium and Firefox are measured on the real export; WebKit could not run here
#    (libicu74 vs libicu78, no sudo). The @supports gate is syntactic, so Safari will
#    very likely pass it and receive an untested refinement -- the same shape Firefox
#    already demonstrates. Accepted by Ben with the epic closed.
#  - The 1.3 screen-reader trade-off stays Ben's separate item. The review added two
#    costs the record did not have: long footnotes scroll their own prose off the top
#    for SIGHTED readers too (the README's "sighted readers are unaffected" was false
#    and is corrected), and AT users get none of the feature's benefit because every
#    arrow carries an identical aria-label. Both make the costed ~15-line reversal
#    cheaper than it first looked.
#
# Lesson worth carrying into the next epic: READONLY_CSS drift has no detector and
# has now cost real correctness once. See deferred-work.md.

