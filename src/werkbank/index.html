<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BPMN-Layout-Werkbank</title>
<link rel="icon" type="image/svg+xml" href="{{slot:favicon}}">
<style>{{slot:bpmn-viewer.css}}</style>
<script>{{slot:bpmn-viewer.js}}</script>
<style>{{slot:doc.css}}</style>
<style>{{slot:page.css}}</style>
</head>
<body>
<header>
<h1>BPMN-Layout-Werkbank</h1>
<span id="stand" title="Die Prüfsumme der Module des Layouts, mit denen diese Seite anordnet; tools/bpmn-layout/lauf.mjs nennt sie Logik">Layout-Stand {{slot:stand}}</span>
<span id="fortschritt" aria-live="polite"></span>
<span id="warnung" hidden></span>
<span id="aktionen">
<details class="menu" id="neu-menu"><summary>Neuer Fall</summary><div class="menu-liste"><button type="button" id="einfuegen-btn">Einfügen …</button><button type="button" id="zeichnen-btn">Zeichnen</button></div></details>
<button type="button" id="paket-btn">Paket herunterladen</button>
<details class="menu" id="mehr-menu"><summary aria-label="Mehr">⋯</summary><div class="menu-liste rechts"><button type="button" id="sichern-btn">Arbeitsstand sichern</button><button type="button" id="laden-btn">Arbeitsstand laden</button><button type="button" id="import-btn" title="arbeit/werkbank-import.json aus tools/werkbank/import.mjs: externe Eingaben, frühere Fassungen, Archiv">Import laden</button></div></details>
<input type="file" id="laden-datei" accept=".json,application/json" hidden><input type="file" id="import-datei" accept=".json,application/json" hidden>
</span>
<p id="meldung" aria-live="polite"></p>
</header>
<div id="frame">
<div id="links">
<nav id="liste" aria-label="Fälle"><ul id="faelle"></ul></nav>
<section id="fall" aria-label="Der gewählte Fall">
<div class="kopf"><strong id="titel"></strong><span id="fall-info"></span></div>
<textarea id="kommentar" rows="3" aria-label="Kommentar" placeholder="Kommentar zum Fall am Stand" disabled></textarea>
<details id="archiv" hidden><summary></summary><ul id="archiv-liste"></ul></details>
</section>
</div>
<main id="leinwand" aria-label="Diagramm">
<div id="leiste"><span id="fassungen" role="group" aria-label="Fassung (Tasten 1 bis 9)"></span><label id="markieren-schalter" title="Markiert, was anders liegt als in der erzeugten Fassung (die erzeugte gegen den letzten anderen Stand), wie tools/bpmn-layout/feedback-auswerten.mjs es misst. Taste M"><input type="checkbox" id="markieren" autocomplete="off"> Änderungen <span id="marken-zahl"></span></label><span id="info"></span><button type="button" id="einpassen" title="Taste 0">Einpassen</button><button type="button" id="bearbeiten" class="primary" hidden>Bearbeiten</button></div>
<div class="dokufix-doc"><div id="canvas" class="dokufix-diagram dokufix-diagram-bpmn"></div></div>
</main>
</div>
<dialog id="einfuegen" aria-labelledby="ein-titel">
<h2 id="ein-titel">BPMN einfügen</h2>
<textarea id="xml" rows="12" spellcheck="false" placeholder="BPMN-XML hier einfügen, mit oder ohne Koordinaten"></textarea>
<div class="zeile"><button type="button" id="ein-datei-btn">Datei wählen …</button><input type="file" id="ein-datei" accept=".bpmn,.xml" hidden><label>Name <input id="ein-name" placeholder="aus dem XML oder der Datei"></label></div>
<label class="zeile"><input type="checkbox" id="ein-neu"> Als neuen Fall anlegen (sonst gehört es zu einem Fall, den es schon gibt)</label>
<p id="ein-meldung" aria-live="polite"></p>
<div id="zuordnung" hidden><div id="vorschlaege"></div><div class="zeile"><select id="alle" aria-label="Alle Fälle"></select><button type="button" id="zuordnen-ok">Diesem Fall zuordnen</button></div></div>
<div class="zeile ende"><button type="button" id="ein-abbrechen">Abbrechen</button><button type="button" id="ein-ok" class="primary">Übernehmen</button></div>
</dialog>
<script type="application/json" id="werkbank-data">{{slot:werkbank-data}}</script>
<script type="text/plain" id="bpmn-modeler-js">{{slot:bpmn-modeler.js}}</script>
<script type="text/plain" id="bpmn-modeler-css">{{slot:bpmn-modeler.css}}</script>
<script type="text/plain" id="dokufix-layout-js">{{slot:layout.js}}</script>
<script>{{slot:page.js}}</script>
</body>
</html>
